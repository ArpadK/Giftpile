# Integration Test Configuration
# Connects to PostgreSQL Testcontainer

# Data Source (dynamically configured by IntegrationTestBase)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
# Enable Flyway for integration tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/postgres
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# Logging
logging.level.root=INFO
logging.level.com.giftpile=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.test=DEBUG
logging.level.org.springframework.boot.test=DEBUG
logging.level.org.flywaydb.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
