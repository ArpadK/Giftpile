spring.application.name=giftpile-backend

# Server
server.port=8080
server.servlet.context-path=/
server.forward-headers-strategy=framework

# Session cookie hardening: HttpOnly blocks JS access, SameSite=Lax mitigates CSRF for the
# session-cookie auth (CSRF filter is disabled), Secure should be enabled behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Database
# Defaults to a file-backed SQLite database (self-host friendly, persists across restarts).
# To use Postgres, set DATABASE_URL, DB_DIALECT, and optionally DB_USER / DB_PASSWORD
# (using separate user/password env vars avoids having to URL-encode special characters):
#   DATABASE_URL=jdbc:postgresql://host:5432/giftpile
#   DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
#   DB_USER=giftpile
#   DB_PASSWORD=your-password
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:giftpile.db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
# Flyway owns the schema; Hibernate does nothing with DDL.
# (ddl-auto=validate is tempting but SQLite reports type affinities rather than declared type
# names, so Hibernate's type-name comparison always fails on SQLite columns.)
spring.jpa.hibernate.ddl-auto=none

# Flyway — enabled for both SQLite (default) and Postgres.
# baseline-on-migrate: silently baselines existing databases that pre-date Flyway adoption
# (e.g. a volume created when ddl-auto=update was in use) rather than refusing to run.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Logging
logging.level.root=INFO
logging.level.com.giftpile=DEBUG
