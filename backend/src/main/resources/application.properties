spring.application.name=giftpile-backend

# Server
server.port=8080
server.servlet.context-path=/

# Session cookie hardening: HttpOnly blocks JS access, SameSite=Lax mitigates CSRF for the
# session-cookie auth (CSRF filter is disabled), Secure should be enabled behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# server.servlet.session.cookie.secure=true

# Database
# Defaults to a file-backed SQLite database (self-host friendly, persists across restarts).
# To use Postgres, set both DATABASE_URL and DB_DIALECT, e.g.:
#   DATABASE_URL=jdbc:postgresql://host:5432/giftpile?user=...&password=...
#   DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:giftpile.db}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
# 'update' avoids wiping data on restart; prefer Flyway migrations for production schemas.
spring.jpa.hibernate.ddl-auto=update

# Flyway is disabled by default. Enable it (and set ddl-auto=validate/none) for managed
# schema migrations in production.
spring.flyway.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.giftpile=DEBUG
